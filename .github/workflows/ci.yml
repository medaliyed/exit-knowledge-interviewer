name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and verify committed assets
        run: |
          npm --prefix frontend run build
          git diff --exit-code -- src/eki/web/static/workspace
      - name: Test interview transport
        working-directory: frontend
        run: npm test
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflows and accessibility
        working-directory: frontend
        run: npm run test:e2e
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: eki
          # Throwaway value for a container that exists only for this job.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: eki
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U eki -d eki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # Python 3.12 comes from .python-version; --locked fails if uv.lock is out of date.
      - name: Install pinned dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Tests marked `infra` or `db` are excluded by default.
      - name: Tests
        run: uv run pytest -q

      # Each database test works in its own throwaway schema.
      - name: Database tests
        env:
          EKI_DATABASE_URL: postgresql://eki:ci-only-not-a-secret@localhost:5432/eki
        run: uv run pytest -q -m db

      # Provider-free behavioral gates; human-owned scenarios/golden remain untouched.
      - name: Quality and adversarial evaluations
        env:
          EKI_DATABASE_URL: postgresql://eki:ci-only-not-a-secret@localhost:5432/eki
          EKI_MODEL_ANSWERER: ""
          EKI_MODEL_EMBEDDING: ""
        run: uv run python evals/run.py --junit reports/quality.xml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install real-browser acceptance dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Follow-up browser journey against the real API
        env:
          EKI_DATABASE_URL: postgresql://eki:ci-only-not-a-secret@localhost:5432/eki
        run: uv run pytest -q -m db tests/test_follow_up_browser.py
