[project]
name = "eki"
version = "0.1.0"
description = "Exit-Knowledge Interviewer: interviews a departing expert and builds a cited runbook."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "langfuse==5.2.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "litellm==1.108.1",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sse-starlette==3.6.0",
    "uvicorn==0.54.0",
]

[project.scripts]
eki = "eki.cli:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Seven-day cooldown: never resolve to a release newer than this (see docs/plans/phase-0.md, D7).
exclude-newer = "2026-11-06T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff also formats Python blocks inside Markdown; the plans hold sketches, not runnable code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607"]
# Scripted interview answers: one sentence per line reads better than wrapped strings.
"tests/fixtures/generator/answers.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "infra: needs the whole docker compose stack running",
    "db: needs Postgres with pgvector (docker compose up -d postgres)",
]
addopts = "-m 'not infra and not db'"
